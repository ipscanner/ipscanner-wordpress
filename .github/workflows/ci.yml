name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: composer install --no-progress
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpcs
        if: matrix.php == '8.3'
      - run: sh bin/build-zip.sh
        if: matrix.php == '8.3'
